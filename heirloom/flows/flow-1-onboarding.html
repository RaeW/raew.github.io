<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heirloom — Flow 1: Onboarding & First Import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    padding: 40px 24px 60px;
    min-height: 100vh;
  }
  .flow-header { text-align: center; margin-bottom: 28px; }
  .flow-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #9A8F7F; margin-bottom: 8px; }
  .flow-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: #3D2B1F; }
  svg { display: block; width: 100%; max-width: 680px; margin: 0 auto; }
</style>
</head>
<body>

<div class="flow-header">
  <div class="flow-eyebrow">Heirloom · Flow 1 of 4 · Revised</div>
  <div class="flow-title">Onboarding and first import</div>
</div>

<svg viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg">
  <title>Flow 1 — Onboarding and first import (revised)</title>
  <desc>Flowchart showing a new user opening Heirloom for the first time, choosing an import path, the app parsing with three possible outcomes: success, low confidence flagged, or failed with immediate retry mode.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A8F7F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C9523A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Header labels -->
  <text x="40" y="22" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="12">Flow 1 of 4</text>
  <text x="340" y="22" text-anchor="middle" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="14" font-weight="500">Onboarding and first import</text>

  <!-- START -->
  <rect x="255" y="36" width="170" height="40" rx="20" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">First time opening app</text>

  <line x1="340" y1="76" x2="340" y2="100" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Welcome screen -->
  <rect x="200" y="100" width="280" height="60" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="340" y="122" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Welcome screen</text>
  <text x="340" y="143" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">"Rescue your recipes. Start by bringing one home."</text>

  <line x1="340" y1="160" x2="340" y2="188" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Diamond: import path -->
  <polygon points="340,188 440,228 340,268 240,228" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="222" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">How to import?</text>
  <text x="340" y="238" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Photo or file?</text>

  <!-- Branch left: Photo -->
  <line x1="240" y1="228" x2="130" y2="228" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="130" y1="228" x2="130" y2="296" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="182" y="218" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Photo</text>

  <!-- Branch right: File -->
  <line x1="440" y1="228" x2="550" y2="228" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="550" y1="228" x2="550" y2="296" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="498" y="218" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">File</text>

  <!-- Photo box -->
  <rect x="48" y="296" width="164" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="130" y="316" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Camera capture</text>
  <text x="130" y="336" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Scan recipe card or printout</text>

  <!-- File box -->
  <rect x="468" y="296" width="164" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="550" y="316" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Choose file</text>
  <text x="550" y="336" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">txt, pdf, or docx</text>

  <!-- Both converge to parsing -->
  <line x1="130" y1="352" x2="130" y2="400" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="550" y1="352" x2="550" y2="400" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="130" y1="400" x2="340" y2="400" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="550" y1="400" x2="340" y2="400" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="340" y1="400" x2="340" y2="412" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- App parses -->
  <rect x="200" y="412" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="432" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">App parses recipe</text>
  <text x="340" y="452" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Extracts ingredients, steps, notes</text>

  <line x1="340" y1="468" x2="340" y2="496" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Diamond: three-way result -->
  <polygon points="340,496 450,536 340,576 230,536" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="528" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Parsing result?</text>
  <text x="340" y="546" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Three outcomes</text>

  <!-- Branch labels -->
  <!-- Success: right -->
  <line x1="450" y1="536" x2="590" y2="536" stroke="#1D9E75" stroke-width="1" fill="none"/>
  <line x1="590" y1="536" x2="590" y2="600" marker-end="url(#arrow-green)" stroke="#1D9E75" stroke-width="1.5" fill="none"/>
  <text x="524" y="526" text-anchor="middle" fill="#085041" font-family="DM Sans, sans-serif" font-size="11">≥ 90% confidence</text>

  <!-- Low confidence: down -->
  <line x1="340" y1="576" x2="340" y2="600" marker-end="url(#arrow-amber)" stroke="#EF9F27" stroke-width="1.5" fill="none"/>
  <text x="362" y="592" fill="#633806" font-family="DM Sans, sans-serif" font-size="11">Borderline</text>

  <!-- Failed: left -->
  <line x1="230" y1="536" x2="90" y2="536" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="90" y1="536" x2="90" y2="600" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="158" y="526" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Failed entirely</text>

  <!-- Success box -->
  <rect x="510" y="600" width="160" height="48" rx="8" fill="#E8F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="590" y="618" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Added to library ✓</text>
  <text x="590" y="636" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="DM Sans, sans-serif" font-size="11">Ready to cook from</text>

  <!-- Low confidence box -->
  <rect x="200" y="600" width="280" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="340" y="618" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Flagged for review</text>
  <text x="340" y="636" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">In library · correction prompted</text>

  <!-- Failed box -->
  <rect x="10" y="600" width="160" height="48" rx="8" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="90" y="618" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Retry mode</text>
  <text x="90" y="636" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Guided re-capture immediately</text>

  <!-- Retry mode detail -->
  <line x1="90" y1="648" x2="90" y2="672" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <rect x="10" y="672" width="160" height="56" rx="8" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="90" y="692" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Deeper scan</text>
  <text x="90" y="710" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">App guides better capture</text>

  <!-- Footer note -->
  <text x="340" y="756" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Retry is triggered immediately in onboarding — no queue, no deferral</text>
  <text x="340" y="772" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">The first import must not end in silence</text>
</svg>

</body>
</html>
