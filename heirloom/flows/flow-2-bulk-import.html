<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heirloom — Flow 2: Bulk Import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    padding: 40px 24px 60px;
  }

  .flow-header {
    text-align: center;
    margin-bottom: 16px;
  }

  .flow-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #9A8F7F;
    margin-bottom: 8px;
  }

  .flow-title {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 600;
    color: #3D2B1F;
    margin-bottom: 12px;
  }

  .open-question {
    max-width: 680px;
    margin: 0 auto 28px;
    padding: 10px 16px;
    background: #FAEEDA;
    border-left: 3px solid #EF9F27;
    border-radius: 0 8px 8px 0;
    font-size: 12px;
    color: #633806;
    line-height: 1.5;
  }

  .oq-label {
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: 10px;
    margin-bottom: 3px;
  }

  svg {
    display: block;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="flow-header">
  <div class="flow-eyebrow">Heirloom · Flow 2 of 4</div>
  <div class="flow-title">Bulk import</div>
</div>

<div class="open-question">
  <div class="oq-label">Open architectural question</div>
  This flow is shown as mobile-only. Bulk upload from a desktop folder may require a separate web interface. That decision is deferred — this flow represents the mobile-first version of the experience.
</div>

<svg viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg">
  <title>Flow 2 — Bulk import</title>
  <desc>Flowchart showing a user importing multiple recipe files at once, the app parsing them in batch, surfacing results by outcome, and the user working through flagged and failed imports.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A8F7F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C9523A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="22" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="12">Flow 2 of 4</text>
  <text x="340" y="22" text-anchor="middle" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="14" font-weight="500">Bulk import</text>

  <!-- Start -->
  <rect x="255" y="36" width="170" height="40" rx="20" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">User taps Import</text>

  <line x1="340" y1="76" x2="340" y2="100" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Select files -->
  <rect x="200" y="100" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="120" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Select files from device</text>
  <text x="340" y="140" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Multiple files selected at once · txt, pdf, docx</text>

  <line x1="340" y1="156" x2="340" y2="180" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- App parses batch -->
  <rect x="200" y="180" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="200" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">App parses all files</text>
  <text x="340" y="220" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Batch processing · progress shown per file</text>

  <line x1="340" y1="236" x2="340" y2="260" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Results summary -->
  <rect x="180" y="260" width="320" height="64" rx="8" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="280" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Import results summary</text>
  <text x="340" y="300" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">e.g. "14 imported · 3 need review · 1 failed"</text>
  <text x="340" y="316" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Successful recipes already in library</text>

  <!-- Three branches -->
  <line x1="340" y1="324" x2="340" y2="348" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="130" y1="348" x2="550" y2="348" stroke="#9A8F7F" stroke-width="1" fill="none"/>

  <line x1="130" y1="348" x2="130" y2="372" marker-end="url(#arrow-green)" stroke="#1D9E75" stroke-width="1.5" fill="none"/>
  <line x1="340" y1="348" x2="340" y2="372" marker-end="url(#arrow-accent)" stroke="#C9523A" stroke-width="1.5" fill="none"/>
  <line x1="550" y1="348" x2="550" y2="372" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <text x="130" y="360" text-anchor="middle" fill="#085041" font-family="DM Sans, sans-serif" font-size="10">Success</text>
  <text x="340" y="360" text-anchor="middle" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="10">Needs review</text>
  <text x="550" y="360" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="10">Failed</text>

  <!-- Success branch -->
  <rect x="48" y="372" width="164" height="48" rx="8" fill="#E8F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="130" y="390" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">In library</text>
  <text x="130" y="408" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="DM Sans, sans-serif" font-size="11">Ready to cook from</text>

  <!-- Needs review branch -->
  <rect x="200" y="372" width="280" height="48" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="390" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Correction queue</text>
  <text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Flagged recipes load one by one</text>

  <!-- Failed branch -->
  <rect x="468" y="372" width="164" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="550" y="390" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Failed queue</text>
  <text x="550" y="408" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">Deeper scan or discard</text>

  <!-- Correction queue flow -->
  <line x1="340" y1="420" x2="340" y2="448" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <rect x="200" y="448" width="280" height="56" rx="8" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="468" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">User reviews each recipe</text>
  <text x="340" y="488" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Accept as-is · edit · or skip for later</text>

  <line x1="340" y1="504" x2="340" y2="528" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Diamond: More to review? -->
  <polygon points="340,528 420,560 340,592 260,560" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="554" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">More to review?</text>
  <text x="340" y="570" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">In queue</text>

  <!-- Yes: loop back -->
  <line x1="420" y1="560" x2="490" y2="560" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="490" y1="560" x2="490" y2="468" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="490" y1="468" x2="480" y2="468" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="510" y="514" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Yes</text>

  <!-- No: Done -->
  <line x1="340" y1="592" x2="340" y2="620" marker-end="url(#arrow-green)" stroke="#1D9E75" stroke-width="1.5" fill="none"/>
  <text x="360" y="608" fill="#085041" font-family="DM Sans, sans-serif" font-size="11">No</text>

  <rect x="200" y="620" width="280" height="36" rx="8" fill="#E8F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="638" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">All reviewed · library ready ✓</text>
</svg>

</body>
</html>
