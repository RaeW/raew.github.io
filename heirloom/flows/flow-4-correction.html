<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heirloom — Flow 4: Manual Correction Lifecycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    padding: 40px 24px 60px;
  }

  .flow-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .flow-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #9A8F7F;
    margin-bottom: 8px;
  }

  .flow-title {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 600;
    color: #3D2B1F;
  }

  svg {
    display: block;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="flow-header">
  <div class="flow-eyebrow">Heirloom · Flow 4 of 4</div>
  <div class="flow-title">Manual correction lifecycle</div>
</div>

<svg viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg">
  <title>Flow 4 — Manual correction lifecycle</title>
  <desc>Flowchart showing a flagged recipe moving from import through correction options — accept, edit, or skip — and eventually to first cook, with the flag cleared along the way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A8F7F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C9523A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="22" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="12">Flow 4 of 4</text>
  <text x="340" y="22" text-anchor="middle" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="14" font-weight="500">Manual correction lifecycle</text>

  <!-- Start: Recipe flagged after import -->
  <rect x="200" y="36" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Recipe flagged after import</text>
  <text x="340" y="76" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">Parsing confidence below threshold · in library but marked</text>

  <line x1="340" y1="92" x2="340" y2="116" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Diamond: How does user encounter it? -->
  <polygon points="340,116 440,156 340,196 240,156" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="148" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">How encountered?</text>
  <text x="340" y="164" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Entry point</text>

  <!-- Branch left: from import queue -->
  <line x1="240" y1="156" x2="110" y2="156" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="110" y1="156" x2="110" y2="220" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="172" y="146" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="10">Import queue</text>

  <!-- Branch right: tapping in library -->
  <line x1="440" y1="156" x2="570" y2="156" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="570" y1="156" x2="570" y2="220" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="508" y="146" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="10">Tapped in library</text>

  <!-- Import queue: shown in sequence -->
  <rect x="30" y="220" width="160" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="110" y="238" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Correction screen</text>
  <text x="110" y="254" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">Shown immediately after import</text>

  <!-- Tapping in library: correction first -->
  <rect x="490" y="220" width="160" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="570" y="238" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Correction screen</text>
  <text x="570" y="254" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">Opens before recipe view</text>

  <!-- Both converge to: user decision -->
  <line x1="110" y1="268" x2="110" y2="316" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="570" y1="268" x2="570" y2="316" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="110" y1="316" x2="340" y2="316" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="570" y1="316" x2="340" y2="316" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="340" y1="316" x2="340" y2="328" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Diamond: User decision -->
  <polygon points="340,328 450,368 340,408 230,368" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="360" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">User chooses</text>
  <text x="340" y="376" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">What to do</text>

  <!-- Three branches: accept / edit / skip -->
  <line x1="340" y1="408" x2="340" y2="428" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="110" y1="428" x2="570" y2="428" stroke="#9A8F7F" stroke-width="1" fill="none"/>

  <line x1="110" y1="428" x2="110" y2="448" marker-end="url(#arrow-green)" stroke="#1D9E75" stroke-width="1.5" fill="none"/>
  <line x1="340" y1="428" x2="340" y2="448" marker-end="url(#arrow-accent)" stroke="#C9523A" stroke-width="1.5" fill="none"/>
  <line x1="570" y1="428" x2="570" y2="448" marker-end="url(#arrow-amber)" stroke="#EF9F27" stroke-width="1.5" fill="none"/>

  <text x="110" y="440" text-anchor="middle" fill="#085041" font-family="DM Sans, sans-serif" font-size="10">Accept as-is</text>
  <text x="340" y="440" text-anchor="middle" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="10">Edit and save</text>
  <text x="570" y="440" text-anchor="middle" fill="#EF9F27" font-family="DM Sans, sans-serif" font-size="10">Skip for now</text>

  <!-- Accept -->
  <rect x="30" y="448" width="160" height="48" rx="8" fill="#E8F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="110" y="466" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Flag cleared</text>
  <text x="110" y="482" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="DM Sans, sans-serif" font-size="11">Recipe finalized as-is</text>

  <!-- Edit -->
  <rect x="200" y="448" width="280" height="48" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="466" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Inline correction</text>
  <text x="340" y="482" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Uncertain ingredients highlighted · edit in place</text>

  <!-- Skip -->
  <rect x="490" y="448" width="160" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="570" y="466" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Flag remains</text>
  <text x="570" y="482" text-anchor="middle" dominant-baseline="central" fill="#7A5020" font-family="DM Sans, sans-serif" font-size="11">Recipe still accessible</text>

  <!-- Edit leads to flag cleared -->
  <line x1="340" y1="496" x2="340" y2="516" marker-end="url(#arrow-green)" stroke="#1D9E75" stroke-width="1.5" fill="none"/>

  <rect x="200" y="516" width="280" height="40" rx="8" fill="#E8F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="536" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Flag cleared · recipe finalized ✓</text>

  <!-- Accept and Edit both lead to cooking -->
  <line x1="110" y1="496" x2="110" y2="600" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="340" y1="556" x2="340" y2="600" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="110" y1="600" x2="340" y2="600" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="340" y1="600" x2="340" y2="612" marker-end="url(#arrow-accent)" stroke="#C9523A" stroke-width="1.5" fill="none"/>

  <!-- Cook it -->
  <rect x="200" y="612" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="632" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Cook from recipe</text>
  <text x="340" y="652" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Step view · photo on completion</text>

  <!-- Skip note -->
  <text x="570" y="510" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="10">User can cook</text>
  <text x="570" y="524" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="10">without correcting</text>

  <!-- Footer note -->
  <text x="340" y="688" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">A skipped recipe is never discarded — the flag persists until the user resolves it</text>
</svg>

</body>
</html>
