<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heirloom — Flow 3: Ingredient Search to Cooking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    padding: 40px 24px 60px;
  }

  .flow-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .flow-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #9A8F7F;
    margin-bottom: 8px;
  }

  .flow-title {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 600;
    color: #3D2B1F;
  }

  svg {
    display: block;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="flow-header">
  <div class="flow-eyebrow">Heirloom · Flow 3 of 4</div>
  <div class="flow-title">Ingredient search to cooking</div>
</div>

<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>Flow 3 — Ingredient search to cooking</title>
  <desc>Flowchart showing the re-engagement loop: a user enters ingredients on hand, finds a matching recipe from their library, cooks from it step by step, and captures a photo of the finished meal.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A8F7F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C9523A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="22" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="12">Flow 3 of 4</text>
  <text x="340" y="22" text-anchor="middle" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="14" font-weight="500">Ingredient search to cooking</text>

  <!-- Start: Home screen -->
  <rect x="255" y="36" width="170" height="40" rx="20" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Home screen</text>

  <line x1="340" y1="76" x2="340" y2="100" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Entry point: re-engagement or search -->
  <polygon points="340,100 440,136 340,172 240,136" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Entry point</text>
  <text x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">How did they arrive?</text>

  <!-- Branch left: re-engagement tap -->
  <line x1="240" y1="136" x2="120" y2="136" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="120" y1="136" x2="120" y2="200" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="178" y="126" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Re-engagement strip</text>

  <!-- Branch right: ingredient search -->
  <line x1="440" y1="136" x2="560" y2="136" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="560" y1="136" x2="560" y2="200" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="502" y="126" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Ingredient search</text>

  <!-- Re-engagement: goes straight to recipe -->
  <rect x="40" y="200" width="160" height="48" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="120" y="218" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Suggested recipe</text>
  <text x="120" y="234" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Haven't made in a while</text>

  <!-- Ingredient search: enter ingredients -->
  <rect x="480" y="200" width="160" height="48" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="560" y="218" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Enter ingredients</text>
  <text x="560" y="234" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Add chips · set all/any toggle</text>

  <!-- Ingredient search: results -->
  <line x1="560" y1="248" x2="560" y2="272" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <rect x="480" y="272" width="160" height="48" rx="8" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="560" y="290" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Results from library</text>
  <text x="560" y="306" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Full and partial matches shown</text>

  <!-- Both converge to: open recipe -->
  <line x1="120" y1="248" x2="120" y2="340" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="560" y1="320" x2="560" y2="340" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="120" y1="340" x2="340" y2="340" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="560" y1="340" x2="340" y2="340" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="340" y1="340" x2="340" y2="352" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Open recipe -->
  <rect x="200" y="352" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Open recipe</text>
  <text x="340" y="392" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Ingredients prep view first</text>

  <line x1="340" y1="408" x2="340" y2="432" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Cook step by step -->
  <rect x="200" y="432" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="452" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Cook step by step</text>
  <text x="340" y="472" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">One step at a time · ingredient overlay on gesture</text>

  <line x1="340" y1="488" x2="340" y2="512" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>

  <!-- Diamond: Last step? -->
  <polygon points="340,512 420,544 340,576 260,544" fill="#EDE5D8" stroke="#9A8F7F" stroke-width="0.5"/>
  <text x="340" y="538" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="12" font-weight="500">Last step?</text>
  <text x="340" y="554" text-anchor="middle" dominant-baseline="central" fill="#7A6A5A" font-family="DM Sans, sans-serif" font-size="11">Done cooking</text>

  <!-- No: next step -->
  <line x1="420" y1="544" x2="490" y2="544" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="490" y1="544" x2="490" y2="460" stroke="#9A8F7F" stroke-width="1" fill="none"/>
  <line x1="490" y1="460" x2="480" y2="460" marker-end="url(#arrow)" stroke="#9A8F7F" stroke-width="1.5" fill="none"/>
  <text x="516" y="502" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Not yet</text>

  <!-- Yes: photo prompt -->
  <line x1="340" y1="576" x2="340" y2="600" marker-end="url(#arrow-accent)" stroke="#C9523A" stroke-width="1.5" fill="none"/>
  <text x="360" y="590" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Done</text>

  <!-- Photo prompt -->
  <rect x="200" y="600" width="280" height="56" rx="8" fill="#F5EDE8" stroke="#C9523A" stroke-width="0.5"/>
  <text x="340" y="620" text-anchor="middle" dominant-baseline="central" fill="#3D2B1F" font-family="DM Sans, sans-serif" font-size="13" font-weight="500">Take a photo?</text>
  <text x="340" y="640" text-anchor="middle" dominant-baseline="central" fill="#C9523A" font-family="DM Sans, sans-serif" font-size="11">Attach to recipe · used as card image in library</text>

  <!-- Footer note -->
  <text x="340" y="672" text-anchor="middle" fill="#9A8F7F" font-family="DM Sans, sans-serif" font-size="11">Photo is optional — the recipe is marked as cooked either way</text>
</svg>

</body>
</html>
